<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocalPoint Studios</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- ✅ HEADER -->
<header>
    <div class="logo">
        <img src="./logo/Screenshot 2024-09-14 at 00.40.36.png" alt="Camera Shop Logo">
    </div>
    <nav>
        <ul class="mega-menu">
            <li><a href="#home">Home</a></li>
            <li><a href="#products">Products</a>
                <ul class="dropdown">
                    <li><a href="#dslr">DSLR Cameras</a></li>
                    <li><a href="#mirrorless">Mirrorless Cameras</a></li>
                    <li><a href="#accessories">Accessories</a></li>
                </ul>
            </li>
        </ul>
    </nav>
</header>

<!-- ✅ SIDEBAR -->
<button id="toggleSidebar">☰ Menu</button>

<div id="sidebar" class="sidebar">
    <div class="sidebar-content">
        <h2>Categories</h2>
        <!-- (unchanged content) -->
    </div>
</div>

<!-- ✅ VIDEO -->
<section class="video-section">
    <video autoplay loop muted>
        <source src="./Videos/video.mp4" type="video/mp4">
    </video>
</section>

<!-- ✅ HERO -->
<section id="home" class="hero">
    <h2>Capture Your Moments</h2>
    <p>Your one-stop-shop</p>
    <button class="cta">Shop Now</button>
</section>

<!-- ✅ COUNTDOWN -->
<section class="countdown">
    <h2>Countdown to the Sale</h2>
    <div id="timer"></div>
</section>

<!-- ✅ CATEGORIES -->
<section class="categories">
    <h2>Explore Our Categories</h2>
</section>

<!-- ✅ PRODUCTS -->
<section class="featured-products">
    <h2>Featured Products</h2>
</section>

<!-- ✅ SLIDER -->
<section class="seo">
    <div class="slider-container">
        <div class="slider">
            <div class="slide"><img src="./slides/1.png"></div>
            <div class="slide"><img src="./slides/2.png"></div>
        </div>
    </div>
</section>

<!-- ✅ FOOTER -->
<footer>
    <p>© FocalPoint Studios | Leon Mpofu</p>
</footer>

<!-- ✅ SCRIPTS AT BOTTOM -->
<script src="script.js"></script>

<script>
document.getElementById('toggleSidebar').onclick = function() {
    const sidebar = document.getElementById('sidebar');
    sidebar.style.display = (sidebar.style.display === 'block') ? 'none' : 'block';
};
</script>

</body>
</html>
